<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>murmur</title>
    <style>
      :root {
        --accent: #ffd93d;
        --accent-2: #ffd93d;
        --accent-soft: rgba(255, 217, 61, 0.16);
        --recording: #f87171;
        --processing: #fbbf24;
        --done: #34d399;
        --error: #f87171;
        --pill-bg: rgba(15, 15, 20, 0.78);
        --pill-border: rgba(255, 255, 255, 0.06);
        /* Toast and tooltip surfaces, named by role (the control panel's dark palette). */
        --toast-bg: #171b1e;
        --toast-text: #e9edef;
        --toast-muted: #a2adb5;
        --hl: #ffd93d;
        --hl-hover: #ffe36b;
        --hl-pressed: #e8c21f;
        --on-hl: #15181b;
        --notice: #8dbbff;
        --focus: #8dbbff;
        --control-border: #6c7882;
      }

      * {
        box-sizing: border-box;
      }

      /* Keyboard focus is only drawn for keyboard users, never after a click. */
      button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: transparent;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
        color: #e6e6f0;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }

      #overlay {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        height: 64px;
        width: 64px;
        display: flex;
        align-items: center;
        padding: 4px;
        gap: 10px;
        background: var(--pill-bg);
        border: 1px solid var(--pill-border);
        border-radius: 32px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow:
          0 12px 32px rgba(0, 0, 0, 0.35),
          0 0 0 1px rgba(255, 255, 255, 0.02) inset;
        transition:
          width 220ms cubic-bezier(0.4, 0.0, 0.2, 1),
          background-color 200ms ease,
          border-color 200ms ease;
        cursor: grab;
      }

      #overlay.dragging {
        cursor: grabbing;
        transition: none;
      }

      #overlay.expanded {
        width: 296px;
      }

      #trigger {
        position: relative;
        isolation: isolate;
        flex: 0 0 auto;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 0;
        padding: 0;
        margin: 0;
        background:
          radial-gradient(circle at 30% 30%, #22282d 0%, #0d1012 70%);
        box-shadow:
          inset 0 0 0 1.5px rgba(255, 255, 255, 0.06),
          0 0 0 0 var(--accent-soft);
        cursor: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        transition:
          box-shadow 200ms ease,
          transform 120ms ease,
          background-color 200ms ease;
      }

      #logo-wrap {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }

      #trigger:hover {
        box-shadow:
          inset 0 0 0 1.5px rgba(255, 255, 255, 0.12),
          0 0 0 6px var(--accent-soft);
      }

      #trigger:active {
        transform: scale(0.96);
      }

      #trigger svg {
        width: 28px;
        height: 28px;
      }

      #trigger::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid transparent;
        opacity: 0;
        pointer-events: none;
        z-index: 0;
      }

      .state-recording #trigger {
        background:
          radial-gradient(circle at 30% 30%, #3f1515 0%, #1a0808 80%);
        box-shadow:
          inset 0 0 0 1.5px rgba(248, 113, 113, 0.4),
          0 0 0 4px rgba(248, 113, 113, 0.18);
      }

      .state-recording #trigger::before {
        content: '';
        position: absolute;
        top: 7px;
        right: 7px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--recording);
        box-shadow: 0 0 12px rgba(248, 113, 113, 0.7);
        z-index: 2;
        animation: pulse 1.2s ease-in-out infinite;
      }

      .state-recording #trigger::after {
        border-color: rgba(248, 113, 113, 0.45);
        opacity: 1;
        animation: record-ring 1.6s ease-out infinite;
      }

      .state-recording #logo-wrap {
        opacity: 0.58;
        transform: scale(0.94);
      }

      @keyframes pulse {
        0%, 100% { transform: scale(0.85); opacity: 0.65; }
        50% { transform: scale(1.15); opacity: 1; }
      }

      @keyframes record-ring {
        0% { transform: scale(1); opacity: 0.75; }
        100% { transform: scale(1.22); opacity: 0; }
      }

      #bars {
        flex: 1 1 auto;
        height: 40px;
        display: none;
        align-items: center;
        gap: 3px;
        padding: 0 12px 0 4px;
      }

      .state-recording #bars,
      .state-vad-listening #bars,
      .state-transcribing #bars,
      .state-transcribing-streaming #bars,
      .state-refining #bars,
      .state-refining-streaming #bars,
      .state-injecting #bars,
      .state-done #bars,
      .state-error #bars {
        display: flex;
      }

      .bar {
        flex: 1 1 0;
        height: 100%;
        max-width: 4px;
        background: linear-gradient(180deg, var(--accent), var(--accent-2));
        border-radius: 2px;
        transform-origin: center;
        transform: scaleY(0.08);
        transition: transform 60ms linear, background 200ms ease;
      }

      .state-recording .bar {
        background: linear-gradient(180deg, #fca5a5, var(--recording));
      }

      /* Mic is open but no speech yet: same family as recording, quieter. */
      .state-vad-listening .bar {
        background: linear-gradient(180deg, #fecaca, #fca5a5);
        opacity: 0.6;
      }

      .state-vad-listening #trigger {
        box-shadow:
          inset 0 0 0 1.5px rgba(248, 113, 113, 0.25),
          0 0 0 4px rgba(248, 113, 113, 0.08);
      }

      .state-transcribing .bar,
      .state-transcribing-streaming .bar,
      .state-refining .bar,
      .state-refining-streaming .bar,
      .state-injecting .bar {
        background: linear-gradient(180deg, #fde68a, var(--processing));
        animation: shimmer 1.4s ease-in-out infinite;
      }

      #overlay.state-done .bar {
        background: linear-gradient(180deg, #6ee7b7, var(--done));
        transform: scaleY(0.55);
      }

      #overlay.state-error .bar {
        background: linear-gradient(180deg, #fca5a5, var(--error));
        transform: scaleY(0.5);
      }

      @keyframes shimmer {
        0%, 100% { opacity: 0.3; transform: scaleY(0.18); }
        50%      { opacity: 1;   transform: scaleY(0.55); }
      }

      .state-transcribing .bar:nth-child(odd),
      .state-transcribing-streaming .bar:nth-child(odd),
      .state-refining .bar:nth-child(odd),
      .state-refining-streaming .bar:nth-child(odd),
      .state-injecting .bar:nth-child(odd) {
        animation-delay: -0.7s;
      }

      .state-transcribing .bar:nth-child(3n),
      .state-transcribing-streaming .bar:nth-child(3n),
      .state-refining .bar:nth-child(3n),
      .state-refining-streaming .bar:nth-child(3n),
      .state-injecting .bar:nth-child(3n) {
        animation-delay: -0.35s;
      }

      #status-chip {
        position: absolute;
        top: -24px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.6);
        color: #c4bde0;
        opacity: 0;
        pointer-events: none;
        white-space: nowrap;
        z-index: 2;
        transition: opacity 200ms ease;
      }

      .state-recording #status-chip,
      .state-vad-listening #status-chip,
      .state-transcribing #status-chip,
      .state-transcribing-streaming #status-chip,
      .state-refining #status-chip,
      .state-refining-streaming #status-chip,
      .state-injecting #status-chip,
      .state-done #status-chip,
      .state-error #status-chip {
        opacity: 1;
      }

      .state-recording #status-chip { color: var(--recording); }
      .state-vad-listening #status-chip { color: #fca5a5; opacity: 0.8; }
      .state-transcribing #status-chip,
      .state-transcribing-streaming #status-chip,
      .state-refining #status-chip,
      .state-refining-streaming #status-chip,
      .state-injecting #status-chip { color: var(--processing); }
      .state-done #status-chip { color: var(--done); }
      .state-error #status-chip { color: var(--error); }

      #info-tooltip {
        position: absolute;
        bottom: calc(100% + 18px);
        left: 50%;
        width: 278px;
        transform: translateX(-50%) translateY(4px) scale(0.98);
        padding: 11px 12px 10px;
        font-size: 12px;
        line-height: 1.4;
        color: var(--toast-text);
        background:
          linear-gradient(180deg, rgba(27, 32, 36, 0.97), rgba(19, 23, 26, 0.97));
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        box-shadow:
          0 18px 44px rgba(0, 0, 0, 0.38),
          0 0 0 1px rgba(233, 237, 239, 0.03) inset;
        opacity: 0;
        pointer-events: none;
        z-index: 4;
        transition:
          opacity 150ms ease,
          transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      #overlay:hover #info-tooltip {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }

      #overlay:hover #status-chip {
        opacity: 0;
      }

      .tooltip-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }

      .tooltip-provider {
        min-width: 0;
      }

      .tooltip-name {
        color: #f4f2ff;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tooltip-model {
        margin-top: 2px;
        color: var(--toast-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tooltip-state {
        flex: 0 0 auto;
        padding: 2px 7px;
        border-radius: 999px;
        color: var(--accent);
        background: rgba(255, 217, 61, 0.12);
        font-size: 12px;
        font-weight: 600;
      }

      .tooltip-rows {
        display: grid;
        gap: 6px;
        padding: 9px 0;
      }

      .tooltip-row {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
      }

      .tooltip-label {
        color: var(--toast-muted);
        font-size: 12px;
        font-weight: 600;
      }

      .tooltip-value {
        min-width: 0;
        color: var(--toast-text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tooltip-keys {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .tooltip-key {
        padding: 2px 6px;
        border-radius: 6px;
        color: rgba(244, 242, 255, 0.95);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.07);
        font-size: 11px;
      }

      .tooltip-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        color: var(--toast-muted);
        font-size: 11px;
      }

      .tooltip-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px rgba(255, 217, 61, 0.7);
      }

      .stream-preview {
        padding: 7px 0 0;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        margin-top: 6px;
      }

      .stream-phase {
        color: var(--toast-muted);
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .stream-text {
        color: var(--toast-text);
        font-size: 11px;
        line-height: 1.4;
        max-height: 72px;
        overflow: hidden;
        white-space: pre-wrap;
        word-break: break-word;
      }

      #queue-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        min-width: 18px;
        height: 18px;
        border-radius: 9px;
        background: var(--accent);
        color: #000;
        font-size: 11px;
        font-weight: 700;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
        z-index: 3;
        pointer-events: none;
      }
      #queue-badge.visible { display: flex; }

      /* Sits above the status chip (24px tall) so the two never overlap. */
      #error-toast {
        position: absolute;
        bottom: calc(100% + 36px);
        left: 50%;
        transform: translateX(-50%);
        width: 296px;
        padding: 12px;
        background: var(--toast-bg);
        border: 1px solid var(--error);
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.45;
        color: var(--toast-text);
        display: none;
        flex-direction: column;
        gap: 10px;
        z-index: 5;
        pointer-events: all;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      }
      #error-toast.visible {
        display: flex;
        animation: toast-in 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #error-toast.notice { border-color: var(--notice); }

      @keyframes toast-in {
        from { opacity: 0; transform: translateX(-50%) translateY(6px); }
        to { opacity: 1; transform: translateX(-50%) translateY(0); }
      }

      .toast-body {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      /* Icon plus colour, so the kind of message never depends on colour alone. */
      .toast-icon {
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
        margin-top: 1px;
        color: var(--error);
      }
      #error-toast.notice .toast-icon { color: var(--notice); }
      .toast-icon .icon-notice { display: none; }
      #error-toast.notice .toast-icon .icon-error { display: none; }
      #error-toast.notice .toast-icon .icon-notice { display: inline; }

      #error-message {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .error-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .error-actions button {
        min-height: 28px;
        padding: 5px 12px;
        border-radius: 8px;
        border: 1px solid var(--control-border);
        background: transparent;
        color: var(--toast-text);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 120ms ease;
      }
      .error-actions button:hover { background: rgba(233, 237, 239, 0.12); }
      .error-actions button:active { background: rgba(233, 237, 239, 0.2); }
      /* One filled action per toast: the obvious next step. */
      .error-actions button.primary {
        background: var(--hl);
        border-color: transparent;
        color: var(--on-hl);
      }
      .error-actions button.primary:hover { background: var(--hl-hover); }
      .error-actions button.primary:active { background: var(--hl-pressed); }
      #dismiss-btn {
        margin-left: auto;
        width: 28px;
        padding: 0;
        display: grid;
        place-items: center;
        border-color: transparent;
        color: var(--toast-muted);
      }

      @media (prefers-reduced-motion: reduce) {
        #error-toast.visible { animation: none; }
        #trigger,
        #logo-wrap,
        #overlay,
        .bar {
          transition-duration: 0.01ms;
        }
        .state-recording #trigger::before,
        .state-recording #trigger::after {
          animation: none;
        }
        .state-transcribing .bar,
        .state-transcribing-streaming .bar,
        .state-refining .bar,
        .state-refining-streaming .bar,
        .state-injecting .bar {
          animation: none;
          opacity: 0.8;
          transform: scaleY(0.4);
        }
      }
    </style>
  </head>
  <body>
    <div id="overlay" class="state-idle">
      <button id="trigger" type="button" title="Click to record, or use the global hotkey">
        <span id="logo-wrap"></span>
      </button>
      <div id="bars" aria-hidden="true"></div>
      <div id="status-chip">idle</div>
      <div id="info-tooltip">murmur</div>
      <div id="queue-badge" role="status" aria-label="recordings queued"></div>
      <div id="error-toast" role="alert">
        <div class="toast-body">
          <svg
            id="toast-icon"
            class="toast-icon"
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <g class="icon-error">
              <path d="M10 2.5 18 16.5H2z" />
              <path d="M10 8v4M10 14.4v.1" />
            </g>
            <g class="icon-notice">
              <circle cx="10" cy="10" r="7.5" />
              <path d="M10 9v5M10 6.1v.1" />
            </g>
          </svg>
          <span id="toast-kind" class="sr-only"></span>
          <span id="error-message"></span>
        </div>
        <div class="error-actions">
          <button id="retry-btn" type="button">Retry</button>
          <button
            id="insert-raw-btn"
            type="button"
            hidden
            title="Insert what you said, exactly as transcribed, without the refinement"
          >
            Insert raw
          </button>
          <button id="log-btn" type="button">Logs</button>
          <button id="dismiss-btn" type="button" aria-label="Dismiss" title="Dismiss (Esc)">
            &#x2715;
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
